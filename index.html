<title>WORD QUEST - 마법 학교 대탈출!</title>
<style>
:root {
  --purple:#8557eb;
  --pink:#ff73b5;
  --yellow:#ffd455;
  --mint:#65dfbc;
  --blue:#6dbaff;
  --ink:#39315e;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Trebuchet MS","Malgun Gothic",sans-serif;
  color:var(--ink);
  min-height:100vh;
  background:linear-gradient(135deg,#ffe0ef,#e4dcff 48%,#cdf7f0);
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #f9b82d;outline-offset:3px}
.app{max-width:860px;margin:auto;padding:20px 15px 50px}
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;margin-bottom:18px
}
.logo{
  color:#7543db;font-size:25px;font-weight:1000;
  text-shadow:2px 2px white
}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  background:white;border:2px solid #eee3ff;
  border-radius:25px;padding:9px 13px;
  font-weight:900;box-shadow:0 4px #e3d4ff
}
.progress{
  height:17px;border-radius:30px;background:white;
  padding:3px;margin-bottom:23px
}
.progress-inner{
  height:100%;width:0%;border-radius:30px;
  background:linear-gradient(90deg,#60dbb4,#70b7ff,#aa81ff);
  transition:width .35s
}
.panel{
  background:#fff;border:4px solid white;border-radius:30px;
  padding:27px;box-shadow:0 12px #d3c2ed,0 18px 30px #6252a31c
}
.center{text-align:center}
h1{font-size:clamp(29px,6vw,49px);margin:10px 0}
h2{font-size:clamp(23px,5vw,32px);margin:12px 0}
p{line-height:1.65}
.hero{font-size:88px;margin:12px 0;animation:float 2.5s infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.subtitle{font-size:18px;font-weight:900;color:#78679b}
.btn{
  background:var(--purple);border:0;color:white;
  padding:15px 23px;border-radius:19px;
  font-size:16px;font-weight:900;box-shadow:0 6px #5832b0;
  margin:4px;min-height:50px
}
.btn:active{transform:translateY(5px);box-shadow:0 1px #5832b0}
.btn:disabled{opacity:.5;cursor:default}
.pink{background:var(--pink);box-shadow:0 6px #d6448d}
.mint{background:#19bc96;box-shadow:0 6px #078b6c}
.light{background:#efe7ff;color:#7553bd;box-shadow:0 5px #d9c9f9}
.chapters{
  display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:23px 0
}
.chapter{
  border:3px solid #eadfff;border-radius:22px;
  padding:18px 10px;background:#faf7ff;text-align:center
}
.chapter .emoji{font-size:45px}
.chapter strong{display:block;margin:10px 0;font-size:17px}
.chapter small{font-weight:800;color:#85799e}
.chapter.done{background:#e8fff4;border-color:#57d7aa}
.chapter.current{background:#f0e7ff;border-color:#a77cff}
.tag{
  display:inline-block;background:#eee5ff;color:#7951d5;
  padding:8px 15px;border-radius:25px;font-size:13px;font-weight:900
}
.scene{
  background:linear-gradient(135deg,#fff0b6,#ffd6eb,#d7d0ff);
  min-height:205px;border:3px solid #f7eaff;border-radius:25px;
  display:flex;justify-content:center;align-items:center;
  margin:18px 0;position:relative;overflow:hidden
}
.scene:before{
  content:"✦ ✧ ✦";position:absolute;top:12px;left:22px;
  color:white;font-size:29px
}
.scene .art{font-size:clamp(65px,15vw,105px);animation:float 2.5s infinite}
.speech{
  background:#f6f0ff;border:2px solid #e6d7ff;
  border-radius:20px;padding:20px;text-align:center;
  font-size:clamp(17px,3vw,22px);font-weight:900;
  line-height:1.65;margin:16px 0
}
.target{color:#7748e2}
.context{
  background:#fff5d8;border-radius:15px;
  padding:13px 15px;font-size:14px;font-weight:800;color:#84601e
}
.question{font-size:20px;font-weight:900;margin:23px 0 14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{
  background:white;border:3px solid #e9dffc;border-radius:20px;
  min-height:115px;padding:14px 9px;
  font-size:16px;font-weight:900;color:var(--ink);
  box-shadow:0 5px #e9dffc
}
.choice:hover:not(:disabled){background:#f8f3ff}
.choice:disabled{cursor:default}
.choice .icon{font-size:39px;display:block;margin-bottom:9px}
.choice.correct{background:#e0fff0;border-color:#39ca98;box-shadow:0 5px #27a87a}
.choice.wrong{background:#ffe8ee;border-color:#ff93ae;box-shadow:0 5px #ee7995}
.feedback{
  background:#e9fff4;border:2px solid #8ce5b8;
  border-radius:17px;padding:15px;margin-top:17px;font-weight:800
}
.feedback.error{background:#fff0f3;border-color:#ffb1c4}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.controls .btn{font-size:14px;padding:11px 14px}
.reward{font-size:85px;margin:18px 0}
.word-cloud{
  display:flex;justify-content:center;flex-wrap:wrap;
  gap:9px;margin:22px 0
}
.chip{
  background:#f0e9ff;color:#7551c5;
  padding:10px 14px;border-radius:25px;font-weight:900
}
.note{text-align:center;color:#877a9f;font-size:13px;font-weight:800;margin-top:28px}
@media(max-width:520px){
  .panel{padding:19px 14px}
  .chapter{padding:14px 7px}
  .chapter strong{font-size:14px}
  .choices{gap:8px}
  .choice{font-size:14px;min-height:108px}
  .top{justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

  {
    text:"The little bird needs help. Be brave and protect it!",
    options:[["☂️🐣","Keep the bird out of the rain"],["🌧️🐣","Leave the bird in the storm"]],
    answer:0,words:["brave","protect"]
  },
  {
    text:"Choose a door, solve the puzzle, and enter the room!",
    options:[["🔐🧩🚪","Open the puzzle door"],["🌳😴","Sleep under a tree"]],
    answer:0,words:["choose","solve","enter"]
  },
  {
    text:"We finally arrive at the treasure room. What do we discover?",
    options:[["💎🏆","A secret treasure"],["🚌🏫","A school bus"]],
    answer:0,words:["finally","arrive","discover"]
  }
];

const KEY="wordQuestMagicV3";

function freshState(){
  return {
    index:0,
    stars:0,
    gems:0,
    mistakes:0,
    completed:false,
    reviewDone:false,
    reviewScore:0
  };
}

function loadState(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY));
    if(!raw || typeof raw.index!=="number")return freshState();
    return {
      ...freshState(),
      ...raw,
      index:Math.min(20,Math.max(0,raw.index))
    };
  }catch(e){return freshState();}
}

let state=loadState();
let phase="home";
let answered=false;
let attempts=0;
let reviewIndex=0;
let reviewScore=0;

const screen=document.getElementById("screen");

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(e){}
}

function updateStats(){
  document.getElementById("stars").textContent="⭐ "+state.stars;
  document.getElementById("gems").textContent="💎 "+state.gems;
  document.getElementById("count").textContent="🗺️ "+state.index+"/20";
  document.getElementById("bar").style.width=(state.index/20*100)+"%";
}

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("이 브라우저에서는 음성 재생을 지원하지 않아요.");
    return;
  }
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));
  utter.lang="en-US";
  utter.rate=.82;
  utter.pitch=1.1;
  const voices=speechSynthesis.getVoices();
  const english=voices.find(v=>v.lang==="en-US") ||
                voices.find(v=>v.lang.startsWith("en"));
  if(english)utter.voice=english;
  speechSynthesis.speak(utter);
}

function panel(html){
  screen.innerHTML='<div class="panel">'+html+'</div>';
  updateStats();
}

function home(){
  phase="home";
  const list=chapters.map((c,i)=>{
    const done=state.index>=(i+1)*5;
    const current=Math.floor(Math.min(state.index,19)/5)===i &&
                  state.index<20;
    return `
      <div class="chapter ${done?"done":current?"current":""}">
        <div class="emoji">${c.emoji}</div>
        <strong>LEVEL ${i+1}<br>${c.title}</strong>
        <small>${done?"✅ CLEAR!":current?"🎯 PLAY NOW":"🔒 COMING SOON"}</small>
      </div>`;
  }).join("");

  panel(`
    <div class="center">
      <div class="hero">🧙‍♀️🏰✨</div>
      <div class="tag">20 MAGIC WORDS · 4 WORLDS</div>
      <h1>WORD QUEST!</h1>
      <div class="subtitle">마법 학교 대탈출!</div>
      <p>
        마법 학교에 갇힌 친구들을 구해 줘!<br>
        영어를 듣고, 이야기를 읽고, 행동을 선택하면<br>
        신비한 마법의 문이 하나씩 열려!
      </p>
    </div>
    <div class="chapters">${list}</div>
    <div class="center">
      <button class="btn pink" onclick="startGame()">
        ${state.index===20?"🏆 모험 결과 보기":state.index>0?"🚀 이어서 모험하기":"🚀 모험 시작!"}
      </button>
      <button class="btn light" onclick="resetGame()">🔄 처음부터</button>
    </div>
  `);
}

function startGame(){
  if(state.index>=20){
    finish();
  }else{
    showMission();
  }
}

function showMission(){
  if(state.index>=20){finish();return;}
  phase="mission";
  answered=false;
  attempts=0;
  const m=missions[state.index];
  const c=chapters[m.chapter];

  const options=m.options.map((o,i)=>`
    <button class="choice" id="choice${i}" onclick="pick(${i})">
      <span class="icon">${o[0]}</span>
      ${o[1]}
    </button>
  `).join("");

  panel(`
    <div class="center">
      <div class="tag">${c.emoji} LEVEL ${m.chapter+1} · MISSION ${state.index+1}/20</div>
      <h2>${c.title}</h2>
      <p class="subtitle">${c.desc}</p>
    </div>
    <div class="scene"><div class="art">${m.scene}</div></div>
    <div class="speech" id="story">${m.line}</div>
    <div class="center">
      <button class="btn light" onclick="readMission()">🔊 영어 듣기</button>
    </div>
    <div class="context">💬 상황 단서: ${m.context}</div>
    <div class="question">🎯 ${m.question}</div>
    <div class="choices">${options}</div>
    <div id="feedback"></div>
    <div class="controls">
      <button class="btn light" onclick="hint()">💡 힌트</button>
      <button class="btn light" onclick="home()">🏠 지도</button>
    </div>
  `);
}

function readMission(){
  speak(missions[state.index].line);
}

function hint(){
  if(phase!=="mission"||answered)return;
  const m=missions[state.index];
  document.getElementById("feedback").innerHTML=
    '<div class="feedback">💡 '+m.hint+'</div>';
}

function pick(choice){
  if(answered||phase!=="mission")return;
  const m=missions[state.index];
  const fb=document.getElementById("feedback");

  if(choice!==m.answer){
    attempts++;
    state.mistakes++;
    save();
    document.getElementById("choice"+choice).classList.add("wrong");
    document.getElementById("choice"+choice).disabled=true;
    fb.innerHTML=`
      <div class="feedback error">
        🌈 아직 괜찮아! 이야기를 다시 읽고 다른 행동을 골라 봐.
        <div style="margin-top:8px">
          <button class="btn light" onclick="readMission()">🔊 다시 듣기</button>
        </div>
      </div>`;
    return;
  }

  answered=true;
  document.getElementById("choice"+choice).classList.add("correct");
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);

  const earned=attempts===0?3:1;
  state.stars+=earned;
  state.gems+=1;
  state.index++;
  save();
  updateStats();

  const chapterEnd=state.index%5===0;
  fb.innerHTML=`
    <div class="feedback">
      🎉 GREAT JOB! +${earned} ⭐ +1 💎<br>
      <span style="color:#6851b2">${m.success}</span>
      <div style="margin-top:14px">
        <button class="btn mint" onclick="nextMission()">
          ${state.index===20?"🏆 모험 완료!":chapterEnd?"🎁 챕터 보상 받기":"➡️ 다음 미션"}
        </button>
      </div>
    </div>`;
  speak(m.success);
}

function nextMission(){
  if(state.index%5===0 && state.index>0){
    chapterReward();
  }else{
    showMission();
  }
}

function chapterReward(){
  phase="reward";
  const chapterNum=state.index/5;
  const c=chapters[chapterNum-1];
  const isLast=state.index===20;
  panel(`
    <div class="center">
      <div class="tag">LEVEL ${chapterNum} CLEAR!</div>
      <div class="reward">${c.emoji}🏆✨</div>
      <h1>CHAPTER CLEAR!</h1>
      <h2>${c.title} 성공!</h2>
      <p class="subtitle">
        영어 문장을 읽고 멋진 선택을 했어!<br>
        지금까지 ${state.index}개의 마법 단어를 만났어.
      </p>
      <div class="reward">🎁💎🎁</div>
      <button class="btn pink" onclick="${isLast?"finish()":"showMission()"}">
        ${isLast?"🏆 최종 결과 보기":"🚀 다음 세계로!"}
      </button>
    </div>
  `);
}

function finish(){
  phase="finish";
  state.completed=true;
  save();
  const chips=missions.map(m=>
    '<span class="chip">'+m.word+'</span>'
  ).join("");

  panel(`
    <div class="center">
      <div class="tag">ALL MISSIONS COMPLETE</div>
      <div class="reward">🏆👑🌈</div>
      <h1>YOU DID IT!</h1>
      <h2>마법 학교 대탈출 성공!</h2>
      <p class="subtitle">
        네가 만난 마법 단어 20개가 모였어!<br>
        이제 새로운 모험에서도 이 단어들을 알아볼 수 있을까?
      </p>
      <div class="word-cloud">${chips}</div>
      <p>⭐ 획득한 별 ${state.stars}개 · 💎 보석 ${state.gems}개</p>
      <button class="btn pink" onclick="startReview()">🎮 보너스 모험 시작!</button>
      <button class="btn light" onclick="home()">🏠 월드맵</button>
    </div>
  `);
}

function startReview(){
  reviewIndex=0;
  reviewScore=0;
  showReview();
}

function showReview(){
  phase="review";
  if(reviewIndex>=reviewItems.length){
    finishReview();
    return;
  }
  const r=reviewItems[reviewIndex];
  panel(`
    <div class="center">
      <div class="tag">BONUS QUEST · ${reviewIndex+1}/10</div>
      <div class="hero">🎲🧙‍♀️✨</div>
      <h2>마법의 마지막 시험!</h2>
      <p>이번에는 영어 이야기를 읽고 바로 행동해 봐!</p>
    </div>
    <div class="speech">${r.text}</div>
    <div class="center">
      <button class="btn light" onclick="speakReview()">🔊 듣기</button>
    </div>
    <div class="question">🎯 What will you do?</div>
    <div class="choices">
      ${r.options.map((o,i)=>`
        <button class="choice" id="reviewChoice${i}" onclick="pickReview(${i})">
          <span class="icon">${o[0]}</span>${o[1]}
        </button>`).join("")}
    </div>
    <div id="feedback"></div>
  `);
}

function speakReview(){
  speak(reviewItems[reviewIndex].text);
}

function pickReview(choice){
  if(phase!=="review")return;
  const r=reviewItems[reviewIndex];
  const correct=choice===r.answer;
  document.querySelectorAll(".choice").forEach(b=>b.disabled=true);
  document.getElementById("reviewChoice"+choice)
    .classList.add(correct?"correct":"wrong");
  document.getElementById("reviewChoice"+r.answer)
    .classList.add("correct");

  if(correct)reviewScore++;

  document.getElementById("feedback").innerHTML=`
    <div class="feedback ${correct?"":"error"}">
      ${correct?"🌟 Fantastic!":"💡 다음에는 더 잘할 수 있어!"}
      <br>이 장면에서 다시 만난 단어:
      <strong>${r.words.join(", ")}</strong>
      <div style="margin-top:13px">
        <button class="btn mint" onclick="nextReview()">
          ➡️ ${reviewIndex===9?"결과 보기":"다음 도전"}
        </button>
      </div>
    </div>`;
}

function nextReview(){
  reviewIndex++;
  showReview();
}

function finishReview(){
  phase="reviewEnd";
  state.reviewDone=true;
  state.reviewScore=Math.max(state.reviewScore,reviewScore);
  save();
  panel(`
    <div class="center">
      <div class="reward">🎊🏆🎊</div>
      <h1>BONUS QUEST CLEAR!</h1>
      <h2>${reviewScore}/10 미션 성공!</h2>
      <p class="subtitle">
        ${reviewScore>=8
          ?"마법 세계의 영어 탐험가가 되었어!"
          :"영어 단서를 다시 만나면 더 익숙해질 거야!"}
      </p>
      <p>단어를 외우는 대신 영어를 사용해서 모험을 완성했어!</p>
      <button class="btn pink" onclick="startReview()">🔄 보너스 재도전</button>
      <button class="btn light" onclick="home()">🏠 월드맵</button>
    </div>
  `);
}

function resetGame(){
  if(!confirm("모든 별과 진행 기록을 지우고 처음부터 시작할까요?"))
    return;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  state=freshState();
  save();
  home();
}

home();
</script>
</body>
</html>
